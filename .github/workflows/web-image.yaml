name: Build and publish Alpirafex web image

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/web-image.yaml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/web-image.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: alpirafex-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/rafex/alpirafex-web:sha-${{ github.sha }}
          provenance: false
          sbom: false

      - name: Update image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          sed -i -E "s#digest: sha256:.*#digest: ${IMAGE_DIGEST}#" \
            clusters/server2/web/kustomization.yaml

      - name: Open digest promotion PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(web): promote image digest"
          title: "chore(web): promote image digest"
          body: "Automated promotion of the Alpirafex web image published by this commit."
          branch: automation/alpirafex-web-digest
          delete-branch: true
