name: Build and publish Alpirafex web image

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/web-image.yaml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/web-image.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: alpirafex-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/rafex/alpirafex-web:sha-${{ github.sha }}
          provenance: false
          sbom: false

      - name: Update image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          sed -i -E "s#digest: sha256:.*#digest: ${IMAGE_DIGEST}#" \
            clusters/server2/web/kustomization.yaml

      - name: Commit promoted image digest
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clusters/server2/web/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image digest is already promoted."
            exit 0
          fi
          git commit -m "chore(web): promote image digest"
          git push origin HEAD:main
